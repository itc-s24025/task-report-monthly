<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>タスク管理システム</title>

    <style>
/* ===== 全体ダーク背景 ===== */
body {
  font-family: sans-serif;
  background: radial-gradient(circle at 20% 20%, #0f2027, #0b0f14 60%);
  color: #eaf6ff;
  margin: 0;
  padding: 0;
}

/* ===== コンテナ（ガラス） ===== */
.container {
  max-width: 1200px;
  margin: 40px auto;
  padding: 30px;
  border-radius: 20px;

  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border: 1px solid rgba(0, 255, 255, 0.25);

  box-shadow:
    0 0 20px rgba(0, 255, 255, 0.15),
    inset 0 0 30px rgba(255, 255, 255, 0.03);
}

/* ===== タイトル ===== */
.system-title {
  font-size: 28px;
  font-weight: bold;
  color: #6ff;
  text-shadow: 0 0 12px rgba(0,255,255,.6);
  margin-bottom: 20px;
}

/* ===== ヘッダー ===== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding-bottom: 10px;
  margin-bottom: 30px;
}

/* ===== メニュー ===== */
.menu {
  display: flex;
  gap: 20px;
  margin-bottom: 30px;
}

.menu-item {
  flex: 1;
  text-align: center;
  padding: 30px 10px;
  border-radius: 16px;
  cursor: pointer;

  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(10px);

  border: 1px solid rgba(0,255,255,0.2);

  transition: .25s;
}

/* ホバー発光 */
.menu-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 18px rgba(0,255,255,.45);
  border-color: rgba(0,255,255,.6);
}

/* ===== コンテンツ横並び ===== */
.content {
  display: flex;
  gap: 20px;
  align-items: flex-start;

  border-top: 1px solid rgba(255,255,255,0.1);
  padding-top: 20px;
}

/* ===== セクション制御 ===== */
.content-section {
  flex: 1;
  display: none;
}

.content-section.active {
  display: block;
}

/* 比率（参考UI風） */
#task {
  flex: 2;
}

#report {
  flex: 1;
}

/* ===== カレンダー枠 ===== */
#calendar {
  max-width: 100%;
  margin: 0 auto;

  background: rgba(255,255,255,0.03);
  padding: 14px;
  border-radius: 16px;

  border: 1px solid rgba(0,255,255,0.2);
}

/* ===== 日別タスクカード ===== */
#day-task-list > div {
  background: rgba(255,255,255,0.04) !important;
  border: 1px solid rgba(0,255,255,0.2) !important;
  backdrop-filter: blur(8px);
  border-radius: 14px !important;

  box-shadow: 0 0 10px rgba(0,255,255,0.12);
}

/* ===== ボタン ===== */
button {
  background: linear-gradient(135deg,#00e5ff,#4facfe);
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  transition: .2s;
  padding: 8px 12px;
}

button:hover {
  box-shadow: 0 0 12px rgba(0,255,255,.6);
}

/* ===== レポートカード ===== */
.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 16px;

  border: 1px solid rgba(0,255,255,0.2);
  backdrop-filter: blur(10px);

  box-shadow: 0 0 14px rgba(0,255,255,0.15);
}

/* ===== テーブル ===== */
.table-area table {
  width: 100%;
  border-collapse: collapse;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  overflow: hidden;
}

.table-area th,
.table-area td {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.table-area th {
  color: #6ff;
}

/* ===== 背景エフェクト ===== */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(
      120deg,
      transparent 40%,
      rgba(0,255,255,.08),
      transparent 60%
    );
  pointer-events: none; /* ← クリック阻害防止 */
}

/* ===== 今日ハイライト ===== */
.fc-day-today {
  background: rgba(0,255,255,0.12) !important;
  box-shadow: inset 0 0 12px rgba(0,255,255,.5);
}

/* ===== モーダル ===== */
#new-task-modal > div {
  background: rgba(20,30,40,.85);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(0,255,255,.25);
  box-shadow: 0 0 30px rgba(0,255,255,.25);
}

        /* ===============================
   空タスク表示エリア（半透明ガラス）
=============================== */

/* 空状態コンテナ */
.empty-task-box {
  margin-top: 12px;
  padding: 24px;
  border-radius: 16px;

  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border: 1px dashed rgba(0, 255, 255, 0.25);
  text-align: center;

  box-shadow:
    inset 0 0 20px rgba(0, 255, 255, 0.05),
    0 0 12px rgba(0, 255, 255, 0.08);
}

 .empty-task-title {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.75);
  margin-bottom: 10px;
}

.empty-task-add {
  display: inline-block;
  margin: 8px 0;
  padding: 6px 14px;

  border-radius: 999px;
  font-size: 14px;

  color: #6ff;
  border: 1px solid rgba(0, 255, 255, 0.35);

  background: rgba(0, 255, 255, 0.05);
  cursor: pointer;
  transition: 0.2s;
}

.empty-task-add:hover {
  background: rgba(0, 255, 255, 0.18);
  box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
}

.empty-task-desc {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.55);
  margin-top: 10px;
  line-height: 1.6;
}

        /* ===== 月次専用上書き ===== */

#report .card {
  padding: 22px;
  border-radius: 16px;
  text-align: center;

  margin-bottom: 16px;
}

#report .card p {
  margin-bottom: 8px;
}

#report .value {
  font-size: 34px;
  font-weight: bold;
  color: #6ff;

  margin-top: 4px;   /* ← 追加 */
}

#report table {
  background: rgba(255,255,255,.05);
}

#report tr:hover {
  background: rgba(0,255,255,.08);
}

  /* ===== レポート操作ボタン横並び ===== */

.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;

  margin-bottom: 16px;   /* ← これを追加 */
}

/* トグル内も横並び */
.toggle {
  display: flex;
  gap: 8px;
}

/* 印刷ボタンだけ少し離す */
.printBtn {
  margin-left: 8px;
}

    </style>

    <!-- FullCalendar CDN -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  </head>

  <body>
    <div class="container">
      <!-- システムタイトル -->
      <div class="system-title">タスク管理システム</div>

      <!-- ユーザー情報 -->
      <div class="header">
        <div>👋 {{ user.name }} さん</div>
        <a href="{{ url_for('auth.logout') }}">ログアウト</a>
      </div>

      <!-- メニュー -->
      <div class="menu">
        <div class="menu-item" onclick="showSection('task')">
          <h3>タスク管理</h3>
          <p>作業内容の登録・計測</p>
        </div>

        <div class="menu-item" onclick="showSection('report')">
          <h3>月次レポート</h3>
          <p>作業時間の集計</p>
        </div>
      </div>

        <div class="content">
          <!-- ===== タスク管理 ===== -->
          <div id="task" class="content-section active">
            <div id="calendar"></div>

            <!-- 空タスク表示 -->
            <div class="empty-task-box">
              <div class="empty-task-title">
                該当タスクはありません
              </div>

              <div class="empty-task-add" id="open-new-task-modal">
                ＋ タスクを追加
              </div>

              <div class="empty-task-desc">
                右上の「＋ 新規タスク」ボタンからタスクを作成できます。
              </div>
            </div>
          </div>


  <!-- ===== 月次レポート ===== -->
  <div id="report" class="content-section">
    {% include "report.html" %}
  </div>

</div>

    <!-- New Task Modal -->
    <div id="new-task-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);align-items:center;justify-content:center;z-index:1000;">
      <div style="background:#fff;padding:20px;border-radius:8px;max-width:600px;width:90%;position:relative;">
        <button id="close-new-task-modal" style="position:absolute;right:12px;top:12px;border:0;background:transparent;font-size:18px;cursor:pointer;">✕</button>
        <h3>新規タスク作成</h3>
        <form id="new-task-form">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;">
            <input type="text" id="task-name" placeholder="タスク名" required style="flex:1;padding:8px;" />
            <select id="category-select" style="padding:8px;"></select>
          </div>
          <div id="modal-category-list" style="display:flex;gap:8px;flex-wrap:nowrap;align-items:center;overflow-x:auto;margin-bottom:8px;padding:4px 8px;">
                <!-- category buttons rendered here (modal) -->
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
            <input type="datetime-local" id="start_time" style="flex:1;padding:8px;" />
            <input type="datetime-local" id="end_time" style="flex:1;padding:8px;" />
          </div>
          <div style="margin-bottom:8px;">
            <textarea id="memo" placeholder="メモ" maxlength="500" style="width:100%;padding:8px;height:80px;"></textarea>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" id="cancel-new-task" style="padding:8px 12px;">キャンセル</button>
            <button type="submit" style="padding:8px 12px;background:#4a90e2;color:#fff;border:0;border-radius:6px;">作成</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      function showSection(id) {
        document.querySelectorAll(".content-section").forEach((section) => {
          section.classList.remove("active");
        });
        document.getElementById(id).classList.add("active");
      }

      document.addEventListener('DOMContentLoaded', async function() {
        const calendarEl = document.getElementById('calendar');
        let selectedDate = new Date().toISOString().slice(0,10);

        function isoDatePlusDays(dateStr, days){
          const d = new Date(dateStr + 'T00:00:00');
          d.setDate(d.getDate() + days);
          return d.toISOString().slice(0,10);
        }

        function formatDateJP(dateStr){
          const d = new Date(dateStr + 'T00:00:00');
          return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
        }

        async function fetchCategories(){
          try{
            const r = await fetch('/api/categories');
            console.log('GET /api/categories', r.status);
            if(!r.ok) return [];
            const j = await r.json();
            console.log('categories', j);
            return j;
          }catch(e){
            console.error('fetchCategories error', e);
            return []
          }
        }

        async function populateCategories(){
          const cats = await fetchCategories();
          const sel = document.getElementById('category-select');
          sel.innerHTML = '<option value="">(カテゴリなし)</option>' + cats.map(c => `<option value="${c.id}">${c.category_name}</option>`).join('');
        }

        async function renderDayTasks(dateStr){
          selectedDate = dateStr;
          document.getElementById('day-panel-title').textContent = formatDateJP(dateStr) + ' のタスク';
          const start = dateStr;
          const end = isoDatePlusDays(dateStr, 1);
          const r = await fetch(`/api/tasks?start=${start}&end=${end}`);
          if(!r.ok){ document.getElementById('day-task-list').innerHTML = '<li>読み込み失敗</li>'; return; }
          const tasks = await r.json();
          const container = document.getElementById('day-task-list');
          container.innerHTML = tasks.map(t => {
            const start_time = t.start_time ? (new Date(t.start_time)).toLocaleString() : '';
            return `<div style="padding:12px;border:1px solid #eee;border-radius:8px;background:#fff;display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style=\"font-weight:600;\">${t.task_name}</div>
                <div style=\"font-size:12px;color:#666;\">${start_time}</div>
                <div style=\"font-size:13px;color:#333;\">${t.extendedProps && t.extendedProps.memo ? t.extendedProps.memo : ''}</div>
              </div>
              <div style=\"display:flex;gap:8px;align-items:center;\">
                <a href=\"/tasks/create?clone_id=${t.id}\" style=\"padding:6px 8px;border-radius:6px;border:1px solid #ddd;text-decoration:none;color:#333;\">複製</a>
                <button data-id=\"${t.id}\" class=\"delete-task-btn\" style=\"padding:6px 8px;border-radius:6px;border:1px solid #e74c3c;background:#fff;color:#e74c3c;cursor:pointer;\">削除</button>
              </div>
            </div>`;
          }).join('') || '<div>該当タスクはありません</div>';
          // attach delete handlers
          container.querySelectorAll('.delete-task-btn').forEach(b=>{
            b.addEventListener('click', async function(){
              const id = this.dataset.id;
              if(!confirm('このタスクを削除しますか？')) return;
              const r = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
              if(r.ok){ renderDayTasks(dateStr); calendar.refetchEvents(); } else { alert('削除失敗'); }
            });
          });
        }

        const calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'timeGridWeek',
          headerToolbar: { left: 'prev,next today', center: 'title', right: 'timeGridWeek,dayGridMonth' },
          selectable: true,
          editable: true,
          events: function(info, successCallback, failureCallback) {
            fetch(`/api/tasks?start=${info.startStr}&end=${info.endStr}`)
              .then(r => r.json())
              .then(data => successCallback(data))
              .catch(err => failureCallback(err));
          },
          dateClick: function(info) {
            // 日付クリックで下部リストを更新
            renderDayTasks(info.dateStr);
          },
          eventDrop: function(info) {
            fetch(`/api/tasks/${info.event.id}`, {
              method: 'PUT',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify({
                start: info.event.start ? info.event.start.toISOString() : null,
                end: info.event.end ? info.event.end.toISOString() : null
              })
            }).then(()=> { calendar.refetchEvents(); renderDayTasks(selectedDate); });
          },
          eventClick: function(info) {
            if (confirm('このタスクを削除しますか？')) {
              fetch(`/api/tasks/${info.event.id}`, { method: 'DELETE' })
                .then(()=> { calendar.refetchEvents(); renderDayTasks(selectedDate); });
            }
          },
          datesSet: function(info){
            // 初期表示時に選択日を今日にしてリストを表示
            // 当月表示切替などのタイミングで呼ばれる
            const todayStr = new Date().toISOString().slice(0,10);
            renderDayTasks(todayStr);
          }
        });
        calendar.render();

        // 新規登録フォーム処理（modal に対応）
        const openModalBtn = document.getElementById('open-new-task-modal');
        const modal = document.getElementById('new-task-modal');
        const closeModal = document.getElementById('close-new-task-modal');
        const cancelBtn = document.getElementById('cancel-new-task');
        const form = document.getElementById('new-task-form');
        const startInput = document.getElementById('start_time');
        const endInput = document.getElementById('end_time');
        const nameInput = document.getElementById('task-name');
        const memoInput = document.getElementById('memo');

        function openModal(){
          modal.style.display = 'flex';
          // reset form
          form.reset();
          setDefaultDateInputs(selectedDate);
        }

        function hideModal(){
          modal.style.display = 'none';
        }

        openModalBtn.addEventListener('click', () => { openModal(); });
        closeModal.addEventListener('click', () => { hideModal(); });
        cancelBtn.addEventListener('click', (e)=>{ e.preventDefault(); hideModal(); });

        // set sensible defaults for start/end based on selectedDate
        function setDefaultDateInputs(dateStr){
          startInput.value = dateStr + 'T09:00';
          endInput.value = dateStr + 'T10:00';
        }
        setDefaultDateInputs(selectedDate);

        // render horizontal category buttons into the modal list
        function renderCategoryButtons(cats){
          const container = document.getElementById('modal-category-list');
           container.innerHTML = '';
           if(cats && cats.length > 0){
             cats.forEach(c => {
               const btn = document.createElement('button');
               btn.type = 'button';
               btn.textContent = c.category_name;
               btn.style.padding = '6px 10px';
               btn.style.border = '1px solid #ddd';
               btn.style.borderRadius = '16px';
               btn.style.background = c.color || '#fff';
               btn.style.cursor = 'pointer';
               btn.dataset.catId = c.id;
               btn.addEventListener('click', function(){
                document.getElementById('category-select').value = this.dataset.catId;
                container.querySelectorAll('button').forEach(b=> b.style.outline='');
                this.style.outline = '2px solid #4a90e2';
               });
               container.appendChild(btn);
             });
           }
           const addBtn = document.createElement('button');
           addBtn.type = 'button';
           addBtn.textContent = '＋ 新規カテゴリ';
           addBtn.style.padding = '6px 10px';
           addBtn.style.border = '1px dashed #aaa';
           addBtn.style.borderRadius = '16px';
           addBtn.style.background = '#fff';
           addBtn.style.cursor = 'pointer';
           addBtn.style.color = '#222';
           addBtn.addEventListener('click', function(){
             const name = prompt('新しいカテゴリ名を入力');
             if(!name) return;
             const color = prompt('色（例: #ff0000）を入力（空欄でデフォルト）');
             fetch('/api/categories', {
               method: 'POST',
               headers: {'Content-Type':'application/json'},
               body: JSON.stringify({ category_name: name, color: color })
             }).then(async r=>{
               if(r.ok){
                 const j = await r.json();
                 const cats = await fetchCategories();
                 renderCategoryButtons(cats);
                 document.getElementById('category-select').value = j.id;
               }else{
                 alert('カテゴリ作成に失敗しました');
               }
             }).catch(e=>{ console.error('create category error', e); alert('カテゴリ作成に失敗しました'); });
           });
           container.appendChild(addBtn);
         }

        // populate hidden select used by the form
        function populateHiddenSelect(cats){
          const sel = document.getElementById('category-select');
          sel.innerHTML = '<option value="">(カテゴリなし)</option>' + (cats && cats.length ? cats.map(c=>`<option value="${c.id}">${c.category_name}</option>`).join('') : '');
        }

         // populate select and buttons
         async function initCategories(){
           const cats = await fetchCategories();
           populateHiddenSelect(cats);
           renderCategoryButtons(cats);
         }
         await initCategories();

        form.addEventListener('submit', async function(e){
          e.preventDefault();
          const payload = {
            task_name: nameInput.value,
            category_id: document.getElementById('category-select').value || null,
            memo: memoInput.value || null,
            start_time: startInput.value || (selectedDate + 'T09:00'),
            end_time: endInput.value || (selectedDate + 'T10:00')
          };
          const r = await fetch('/api/tasks', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
          });
          if(r.ok){
            hideModal();
            nameInput.value=''; memoInput.value='';
            calendar.refetchEvents();
            renderDayTasks(selectedDate);
          }else{
            alert('作成に失敗しました');
          }
        });

        // close modal handler
        document.getElementById('close-new-task-modal').addEventListener('click', function(){
          document.getElementById('new-task-modal').style.display = 'none';
        });

        // cancel button in modal
        document.getElementById('cancel-new-task').addEventListener('click', function(){
          document.getElementById('new-task-modal').style.display = 'none';
        });
      });
     </script>
   </body>
 </html>
