<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>タスク管理システム</title>

    <style>
      body {
        font-family: sans-serif;
        background-color: #f5f6f8;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 1000px;
        margin: 40px auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
      }

      /* システムタイトル */
      .system-title {
        text-align: center;
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
        margin-bottom: 30px;
      }

      .menu {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 40px;
      }

      .menu-item {
        flex: 1;
        text-align: center;
        padding: 30px 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        cursor: pointer;
        background-color: #fafafa;
      }

      .menu-item:hover {
        background-color: #eaf0ff;
      }

      .content {
        border-top: 1px solid #ddd;
        padding-top: 20px;
      }

      .content-section {
        display: none;
      }

      .content-section.active {
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- システムタイトル -->
      <div class="system-title">タスク管理システム</div>

      <!-- ユーザー情報 -->
      <div class="header">
        <div>👋 {{ user.name }} さん</div>
        <a href="{{ url_for('auth.logout') }}">ログアウト</a>
      </div>

      <!-- メニュー -->
      <div class="menu">
        <div class="menu-item" onclick="showSection('task')">
          <h3>タスク管理</h3>
          <p>作業内容の登録・計測</p>
        </div>

        <div class="menu-item" onclick="showSection('report')">
          <h3>月次レポート</h3>
          <p>作業時間の集計</p>
        </div>
      </div>

      <!-- コンテンツ -->
      <div class="content">
        <div id="task" class="content-section active">
          {% include "task_create.html" %}
        </div>

        <div id="today" class="content-section">
          <h2>本日の一覧</h2>
          <p>ここに本日のタスク一覧を表示します。</p>
        </div>

        <div id="report" class="content-section">
          <h2>月次レポート</h2>
          <p>ここに月次集計結果を表示します。</p>
        </div>
      </div>
    </div>

    <script>
      function showSection(id) {
        document.querySelectorAll(".content-section").forEach((section) => {
          section.classList.remove("active");
        });
        document.getElementById(id).classList.add("active");
      }
    </script>
  </body>
</html>
