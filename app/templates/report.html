<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月次レポート - タスク管理</title>
  <!-- CSS読み込み -->
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  />
</head>
<body>

<div class="page">

  <!-- ===== ヘッダー ===== -->
  <header class="report-header">
    <h2>月次レポート</h2>

    <div class="controls">
      <select id="yearSelect"></select>
      <select id="monthSelect"></select>

      <div class="toggle">
        <button id="projectBtn" class="active">
          プロジェクト別
        </button>

        <button id="categoryBtn">
          カテゴリ別
        </button>
      </div>

      <button onclick="window.print()" class="printBtn">
        印刷
      </button>
    </div>
  </header>

  <!-- ===== サマリー ===== -->
  <section class="summary">

    <div class="card">
      <div class="label">総作業時間</div>
      <div class="value">
        <span id="totalHours">0.0</span> h
      </div>
    </div>

    <div class="card">
      <div class="label">総作業日数</div>
      <div class="value">
        <span id="workDays">0</span> 日
      </div>
    </div>

  </section>

  <!-- ===== テーブル ===== -->
  <section class="table-area">

    <table id="reportTable">
      <thead>
        <tr>
          <th id="groupHeader">カテゴリ名</th>
          <th>作業時間(h)</th>
          <th>割合(%)</th>
        </tr>
      </thead>

      <tbody id="reportBody"></tbody>
    </table>

  </section>

</div>

<!-- JS読み込み（body最後推奨） -->
<script src="{{ url_for('static', filename='report.js') }}"></script>

</body>
</html>
